<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"/> <meta name="viewport" content="width=device-width,initial-scale=1.0"/> <title>苹果设备查询</title> <style> *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} :root{--bg:#000;--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.10);--border:rgba(255,255,255,.10);--border-focus:rgba(255,255,255,.30);--text:#f5f5f7;--muted:#86868b;--dim:#48484a;--accent:#0a84ff;--accent-glow:rgba(10,132,255,.25);--good:#30d158;--good-bg:rgba(48,209,88,.15);--bad:#ff453a;--bad-bg:rgba(255,69,58,.15);--warn:#ffd60a;--warn-bg:rgba(255,214,10,.15);--neu:#636366;--neu-bg:rgba(99,99,102,.20);--r:16px;--rs:10px;--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Helvetica Neue',sans-serif;--mono:ui-monospace,'SF Mono','Menlo',monospace} html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased} body{background-image:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(10,132,255,.12) 0%,transparent 65%)} .page{max-width:680px;margin:0 auto;padding:2rem 1.25rem 6rem} .hdr{text-align:center;padding:3.5rem 0 2.5rem} .hdr-logo{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,#1c1c1e,#2c2c2e);border:1px solid rgba(255,255,255,.12);font-size:2.2rem;margin-bottom:1.25rem;box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)} .hdr h1{font-size:2.1rem;font-weight:700;letter-spacing:-.04em} .hdr p{color:var(--muted);margin-top:.5rem;font-size:.9375rem} .glass{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)} .sc{padding:1.5rem;margin-bottom:1rem} .sc-label{display:block;font-size:.6875rem;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:.75rem} .sc-row{display:flex;gap:.625rem} .sc-input{flex:1;padding:.8rem 1rem;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--mono);font-size:.9375rem;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none} .sc-input::placeholder{color:var(--dim)} .sc-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-glow)} .sc-btn{padding:.8rem 1.5rem;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-family:var(--font);font-weight:600;font-size:.9375rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.45rem;transition:opacity .15s,transform .1s} .sc-btn:hover{opacity:.85}.sc-btn:active{transform:scale(.97)}.sc-btn:disabled{opacity:.35;cursor:not-allowed;transform:none} .sc-hint{margin-top:.6rem;font-size:.8rem;color:var(--dim)} .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .6s linear infinite;display:none;flex-shrink:0} .loading .spin{display:block}.loading .bi{display:none} @keyframes rot{to{transform:rotate(360deg)}} .err{display:none;align-items:flex-start;gap:.75rem;padding:1rem 1.25rem;margin-bottom:1rem;background:var(--bad-bg);border:1px solid rgba(255,69,58,.25);border-radius:var(--rs);color:var(--bad);font-size:.9rem;line-height:1.5} .err.show{display:flex} .rc{display:none;margin-bottom:1rem;overflow:hidden} .rc.show{display:block;animation:fu .35s cubic-bezier(.22,.68,0,1.2) both} @keyframes fu{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}} .rc-head{display:flex;align-items:center;gap:1rem;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)} .rc-icon{font-size:2.8rem;flex-shrink:0} .rc-name{font-size:1.1rem;font-weight:700;letter-spacing:-.02em} .rc-meta{font-size:.8rem;color:var(--muted);margin-top:.25rem;font-family:var(--mono);word-break:break-all} .rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))} .ri{padding:1rem 1.25rem;border-bottom:1px solid var(--border);border-right:1px solid var(--border)} .ri-lbl{font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:.4rem} .bdg{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .65rem;border-radius:999px;font-size:.8125rem;font-weight:600} .bdg::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0} .g{background:var(--good-bg);color:var(--good)}.g::before{background:var(--good)} .b{background:var(--bad-bg);color:var(--bad)}.b::before{background:var(--bad)} .w{background:var(--warn-bg);color:var(--warn)}.w::before{background:var(--warn)} .n{background:var(--neu-bg);color:var(--neu)}.n::before{background:var(--neu)} .plain{font-size:.9rem;font-weight:500;color:var(--text)} .hs{margin-top:.5rem} .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;padding:0 .25rem} .st{font-size:.875rem;font-weight:600;color:var(--muted)} .clr{font-size:.8125rem;color:var(--dim);background:none;border:none;cursor:pointer;font-family:var(--font);padding:.25rem .5rem;border-radius:6px;transition:color .15s} .clr:hover{color:var(--bad)} .hl{display:flex;flex-direction:column} .hi{display:flex;align-items:center;gap:.75rem;padding:.875rem 1.25rem;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)} .hi:last-child{border-bottom:none}.hi:hover{background:var(--surface2)} .hi-ic{font-size:1.4rem;flex-shrink:0} .hi-info{flex:1;min-width:0} .hi-model{font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hi-sn{font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-top:.1rem} .hi-bdgs{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem} .hi-time{font-size:.75rem;color:var(--dim);flex-shrink:0} .he{text-align:center;padding:2.5rem 1rem;color:var(--dim);font-size:.875rem} .ft{text-align:center;margin-top:3rem;font-size:.8rem;color:var(--dim);line-height:2} .ft a{color:var(--muted);text-decoration:none}.ft a:hover{color:var(--text)} @media(max-width:500px){.hdr h1{font-size:1.6rem}.sc-row{flex-direction:column}.sc-btn{width:100%;justify-content:center}.rc-grid{grid-template-columns:1fr 1fr}.hi-time{display:none}} </style> </head> <body> <div class="page"> <header class="hdr"> <div class="hdr-logo">&#x1F34E;</div> <h1>苹果设备查询</h1> <p>输入序列号，即时查询设备状态与保修信息</p> </header> <div class="glass sc"> <label class="sc-label" for="qi">请输入序列号</label> <div class="sc-row"> <input id="qi" class="sc-input" type="text" placeholder="序列号（如 W0XFRFNY6R）" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="20"/> <button id="qb" class="sc-btn" id="qb"> <span class="bi">&#x1F50D;</span> <div class="spin"></div> <span id="bt">查询</span> </button> </div> <p class="sc-hint">序列号：8–12 位字母数字</p> </div> <div id="er" class="err"><span>&#x26A0;&#xFE0F;</span><span id="em"></span></div> <div id="rc" class="glass rc"> <div class="rc-head"> <div id="ri" class="rc-icon">&#x1F4F1;</div> <div><div id="rn" class="rc-name"></div><div id="rm" class="rc-meta"></div></div> </div> <div id="rg" class="rc-grid"></div> </div> <div class="hs"> <div class="sh"><span class="st">查询历史</span><button class="clr" id="clrBtn">清除</button></div> <div id="hl" class="glass hl"></div> </div> <footer class="ft">数据来源：<a href="https://imei.org" target="_blank">IMEI.org</a> &nbsp;·&nbsp; 仅供参考</footer> </div> <script> (function(){ var HK='apple_checker_v2'; function el(id){return document.getElementById(id)} function bdg(t,c){return'<span class="bdg '+c+'">'+t+'</span>'} function icloudBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u==='CLEAN')return bdg('CLEAN ✓','g');if(u.indexOf('LOST')>=0||u.indexOf('STOLEN')>=0)return bdg('丢失/被盗 ✗','b');if(u==='ON'||u==='LOCKED')return bdg('已锁定 ✗','b');if(u==='OFF')return bdg('未锁定 ✓','g');return bdg(v,'n')} function fmiBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u==='OFF')return bdg('OFF ✓','g');if(u==='ON')return bdg('ON ✗','b');return bdg(v,'n')} function simBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u==='UNLOCKED')return bdg('UNLOCKED ✓','g');if(u==='LOCKED')return bdg('LOCKED ✗','b');return bdg(v,'w')} function warBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u.indexOf('ACTIVE')>=0||u==='YES')return bdg('保修中 ✓','g');if(u.indexOf('OUT')>=0||u.indexOf('EXPIRED')>=0||u==='NO')return bdg('已过期','w');return bdg(v,'n')} function actBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u==='YES'||u==='ACTIVATED')return bdg('已激活 ✓','g');if(u==='NO')return bdg('未激活','n');return bdg(v,'n')} function acBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u==='YES'||u==='ACTIVE')return bdg('已购买 ✓','g');if(u==='NO')return bdg('未购买','n');return bdg(v,'n')} function blBdg(v){if(!v||v==='-')return bdg('未知','n');var u=v.toUpperCase();if(u==='CLEAN')return bdg('CLEAN ✓','g');if(u.indexOf('BLACKLIST')>=0||u.indexOf('BLOCKED')>=0)return bdg('已列黑 ✗','b');return bdg(v,'n')} function plain(v){return(v&&v!=='-')?'<span class="plain">'+v+'</span>':bdg('未知','n')} function devIcon(m){if(!m)return'📱';var u=m.toUpperCase();if(u.indexOf('IPAD')>=0)return'📱';if(u.indexOf('MACBOOK')>=0)return'💻';if(u.indexOf('WATCH')>=0)return'⌚';if(u.indexOf('AIRPOD')>=0)return'🎧';return'📱'} function setLoading(on){var btn=el('qb');if(on){btn.disabled=true;btn.classList.add('loading');el('bt').textContent='查询中'}else{btn.disabled=false;btn.classList.remove('loading');el('bt').textContent='查询'}} function showErr(msg){el('em').textContent=msg;el('er').classList.add('show')} function hideErr(){el('er').classList.remove('show')} function hideResult(){el('rc').classList.remove('show')} function loadHist(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){return[]}} function saveHist(json,input){ var d=json.data||{}; function get(){for(var i=0;i<arguments.length;i++){var v=d[arguments[i]];if(v&&v!=='-')return v;}return''} var e={input:input,model:get('Model','model','Device')||'未知型号',icloud:get('iCloud','icloud'),fmi:get('FMI','fmi'),sim:get('Simlock','simlock'),time:new Date().toLocaleString('zh-CN',{hour12:false})}; var h=loadHist().filter(function(x){return x.input!==input});h.unshift(e);if(h.length>10)h.length=10; localStorage.setItem(HK,JSON.stringify(h)); } function renderHist(){ var h=loadHist();var e=el('hl'); if(!h.length){e.innerHTML='<div class="he">暂无查询记录</div>';return} e.innerHTML=h.map(function(x){return'<div class="hi" data-input="'+x.input+'"><div class="hi-ic">'+devIcon(x.model)+'</div><div class="hi-info"><div class="hi-model">'+x.model+'</div><div class="hi-sn">'+x.input+'</div><div class="hi-bdgs">'+icloudBdg(x.icloud)+fmiBdg(x.fmi)+simBdg(x.sim)+'</div></div><div class="hi-time">'+x.time+'</div></div>'}).join(''); var items=e.querySelectorAll('.hi');for(var i=0;i<items.length;i++){(function(inp){items[i].addEventListener('click',function(){el('qi').value=inp;doQuery()})})(h[i].input)} } function renderResult(json,input){ var d=json.data||{}; function get(){for(var i=0;i<arguments.length;i++){var v=d[arguments[i]];if(v&&v!=='-'&&v!=='N/A')return v;}return''} var model=get('Model','model','Device')||'未知型号'; el('ri').textContent=devIcon(model);el('rn').textContent=model; var sn=get('Serial Number','serial_number')||''; var imei=get('IMEI','imei')||''; var meta=[];if(sn)meta.push('SN: '+sn);if(imei)meta.push('IMEI: '+imei);meta.push('查询: '+input); el('rm').textContent=meta.join(' · '); var fields=[ {l:'iCloud 状态',h:icloudBdg(get('iCloud','icloud','iCloud Status'))}, {l:'查找我的 iPhone',h:fmiBdg(get('FMI','fmi','Find My iPhone'))}, {l:'SIM 锁',h:simBdg(get('Simlock','simlock','SIM Lock','Network'))}, {l:'保修状态',h:warBdg(get('Warranty Status','warranty_status','Warranty'))}, {l:'AppleCare',h:acBdg(get('Apple Care','applecare','AppleCare'))}, {l:'激活状态',h:actBdg(get('Activated','activated'))}, {l:'黑名单',h:blBdg(get('Blacklist Status','blacklist'))}, {l:'购买国家',h:plain(get('Country','country','Purchase Country'))} ]; el('rg').innerHTML=fields.map(function(f){return'<div class="ri"><div class="ri-lbl">'+f.l+'</div><div>'+f.h+'</div></div>'}).join(''); el('rc').classList.add('show'); } function doQuery(){ var input=el('qi').value.trim().toUpperCase(); if(!input){showErr('请输入序列号');return} hideErr();hideResult();setLoading(true); var xhr=new XMLHttpRequest(); xhr.open('POST','/api/query',true); xhr.setRequestHeader('Content-Type','application/json'); xhr.timeout=30000; xhr.onload=function(){ setLoading(false); try{ var json=JSON.parse(xhr.responseText); if(!json.ok){showErr(json.error||'查询失败，请稍后重试');return} renderResult(json,input);saveHist(json,input);renderHist(); }catch(e){showErr('解析错误，请重试')} }; xhr.onerror=function(){setLoading(false);showErr('网络错误，请检查连接后重试')}; xhr.ontimeout=function(){setLoading(false);showErr('请求超时，请重试')}; xhr.send(JSON.stringify({input:input})); } el('qb').addEventListener('click',doQuery); el('qi').addEventListener('keydown',function(e){if(e.key==='Enter')doQuery()}); el('clrBtn').addEventListener('click',function(){localStorage.removeItem(HK);renderHist()}); renderHist(); })(); </script> </body> </html>
